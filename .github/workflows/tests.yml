name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv venv --python ${{ matrix.python-version }} .venv

      - name: Install package and test deps
        run: |
          uv pip install --python .venv/bin/python -e .
          uv pip install --python .venv/bin/python pytest pytest-asyncio

      - name: Run offline test suite
        # The integration marker hits live X.com and needs cookies, so CI runs
        # the offline suite only (249 tests).
        run: .venv/bin/python -m pytest -q -m "not integration"
